<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InfernoTactics | Palisades Command View</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="cesiumContainer"></div>
  <header class="topbar"><strong>INFERNO<span>TACTICS</span></strong><small>PALISADES RESPONSE SIMULATION</small><div class="status" id="connection">CONNECTING</div></header>
  <aside class="panel left">
    <div class="eyebrow">COMMAND MODE</div>
    <div class="controls"><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button><button id="step">Step</button></div>
    <label>Mode<select id="mode"><option value="heuristic">Heuristic demo</option><option value="autopilot">RL autopilot</option><option value="manual">Manual dispatch</option></select></label>
    <label>Scenario<select id="scenario"><option value="single">Random WUI ignition</option><option value="anchor">Skull Rock anchor</option><option value="mandeville">Mandeville Canyon</option><option value="getty">Getty View Park</option><option value="multi">Multi-ignition</option></select></label>
    <div class="manual" id="manual">
      <label>Resource<select id="resource"><option>helicopter</option><option>water_team</option><option>trench_crew</option><option>rescue_vehicle</option></select></label>
      <label>Target zone <input id="zone" type="number" min="0" max="31" value="18"></label>
      <button id="dispatch">Queue dispatch</button>
    </div>
    <div class="eyebrow">LIVE STATE</div>
    <div class="metrics"><div><small>TICK</small><b id="tick">0</b></div><div><small>REWARD</small><b id="reward">0</b></div><div><small>BUILDINGS LOST</small><b id="destroyed">0</b></div><div><small>ACTIVE FIRE</small><b id="fireCount">0</b></div></div><div class="terminal" id="terminal"></div>
    <div class="eyebrow">FLEET</div><div id="fleet" class="fleet"></div>
    <div class="eyebrow">EVENTS</div><div id="events" class="events"></div>
  </aside>
  <aside class="panel right"><div class="eyebrow">LAYERS</div><label class="check"><input type="checkbox" id="buildings" checked> Buildings</label><label class="check"><input type="checkbox" id="roads" checked> Roads</label><label class="check"><input type="checkbox" id="fire" checked> Active fire</label><label class="check"><input type="checkbox" id="depots" checked> Depots</label><button id="camera">Reset camera</button><p class="hint">Pan, orbit, zoom, and click buildings in the Palisades display area.</p></aside>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
