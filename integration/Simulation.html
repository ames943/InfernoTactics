<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Palisades 3D Wildfire Simulator</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #000; color: #fff; }
    #cesiumContainer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #leafletContainer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; display: none; }
    #header-bar {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(10,15,30,0.94); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.18); border-radius: 40px;
      padding: 10px 24px; display: flex; align-items: center; gap: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6); z-index: 10;
    }
    .hud-title { font-weight: 800; font-size: 1.1rem; color: #ff4500; letter-spacing: 0.5px; text-shadow: 0 0 12px rgba(255,69,0,0.5); }
    .view-toggle { display: flex; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 2px; }
    .view-btn { padding: 6px 14px; border: none; border-radius: 18px; font-size: 0.78rem; font-weight: 700; cursor: pointer; background: transparent; color: #94a3b8; transition: all 0.2s; }
    .view-btn.active { background: #38bdf8; color: #080c14; box-shadow: 0 0 10px rgba(56,189,248,0.5); }
    #home-btn {
      position: absolute; top: 16px; right: 20px;
      background: rgba(10,15,30,0.94); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 30px;
      padding: 10px 18px; color: #f8fafc; font-weight: 700; font-size: 0.85rem;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 10; transition: all 0.2s ease;
    }
    #home-btn:hover { background: #38bdf8; color: #080c14; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div id="header-bar">
    <div class="hud-title">🔥 PALISADES 3D WILDFIRE SIMULATOR</div>
    <div class="view-toggle">
      <button id="btn-3d" class="view-btn active" onclick="switchEngine('3d')">3D Globe</button>
      <button id="btn-2d" class="view-btn" onclick="switchEngine('2d')">2D Map</button>
    </div>
  </div>
  <button id="home-btn" onclick="resetCameraView()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Reset View
  </button>
  <div id="cesiumContainer"></div>
  <div id="leafletContainer"></div>

  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI6ZGQ0ZjEwNC1jMjlhLTRlNGUtYjllNi0wNDdiYzcxNjkwZDUiLCJpZCI6NDYxNTk3LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODUyNzI5NjF9.oJ2oHETvVIw69GjOaAxuDiron7whJZf9rx4X3Hm6xNE';
    Cesium.GoogleMaps.defaultApiKey = 'AIzaSyCNM4xw2KhA-EdRWElXl3OX0_NHxB067jA';

    let viewer = null;
    let leafletMap = null;
    let currentEngine = '3d';
    let gridBounds = null;

    function initMapEngines() {
      // Use OpenStreetMap as the guaranteed-working base layer
      viewer = new Cesium.Viewer('cesiumContainer', {
        imageryProvider: new Cesium.OpenStreetMapImageryProvider({
          url: 'https://tile.openstreetmap.org/'
        }),
        baseLayerPicker: false,
        timeline: false,
        animation: false,
        homeButton: false,
        navigationHelpButton: false,
        geocoder: false,
        sceneModePicker: false
      });

      // Disable atmosphere haze (causes blue tint)
      viewer.scene.skyAtmosphere.show = false;
      viewer.scene.globe.showGroundAtmosphere = false;
      viewer.scene.globe.enableLighting = true;
      viewer.scene.globe.depthTestAgainstTerrain = true;

      // ─── VERTICAL EXAGGERATION (correct API for CesiumJS 1.85+) ─────────────
      // scene.verticalExaggeration replaced the old globe.terrainExaggeration.
      // Set to 2.5 so the Santa Monica mountains rise visibly above the flatlands.
      viewer.scene.verticalExaggeration = 2.5;
      viewer.scene.verticalExaggerationRelativeHeight = 0.0; // exaggerate relative to sea level
      // ─────────────────────────────────────────────────────────────────────────

      // Layer satellite imagery on top of OSM base
      viewer.imageryLayers.addImageryProvider(
        new Cesium.UrlTemplateImageryProvider({
          url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          maximumLevel: 19
        })
      );

      // Load Cesium World Terrain (real elevation data for mountains/canyons)
      Cesium.createWorldTerrainAsync({
        requestVertexNormals: true,
        requestWaterMask: true
      }).then(terrain => {
        viewer.terrainProvider = terrain;
        console.log('✅ World Terrain loaded — mountains now have real elevation');
      }).catch(e => console.warn('Terrain load failed:', e));

      // Load OSM 3D Buildings for building heights
      Cesium.createOsmBuildingsAsync().then(buildings => {
        buildings.maximumScreenSpaceError = 2;
        viewer.scene.primitives.add(buildings);
        console.log('✅ OSM 3D Buildings loaded');
      }).catch(e => console.warn('OSM buildings failed:', e));

      // Load Google Photorealistic 3D Tiles for ultra-detail surface textures
      Cesium.createGooglePhotorealistic3DTileset().then(tileset => {
        tileset.maximumScreenSpaceError = 2;
        viewer.scene.primitives.add(tileset);
        console.log('✅ Google Photorealistic 3D Tiles loaded');
      }).catch(e => console.warn('Google 3D Tiles failed:', e));

      // Leaflet 2D fallback
      leafletMap = L.map('leafletContainer', { zoomControl: true }).setView([34.065, -118.525], 13);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19, attribution: 'Esri'
      }).addTo(leafletMap);

      switchEngine('3d');
      fetchGridAndRender();
    }

    function switchEngine(mode) {
      currentEngine = mode;
      document.getElementById('btn-3d').classList.toggle('active', mode === '3d');
      document.getElementById('btn-2d').classList.toggle('active', mode === '2d');
      document.getElementById('cesiumContainer').style.display = mode === '3d' ? 'block' : 'none';
      document.getElementById('leafletContainer').style.display = mode === '2d' ? 'block' : 'none';
      if (mode === '3d' && viewer) { viewer.resize(); resetCameraView(); }
      if (mode === '2d' && leafletMap) { leafletMap.invalidateSize(); }
    }

    function resetCameraView() {
      if (!viewer || currentEngine !== '3d') return;
      const lon = gridBounds ? (gridBounds.minLon + gridBounds.maxLon) / 2 : -118.525;
      const lat = gridBounds ? (gridBounds.minLat + gridBounds.maxLat) / 2 : 34.065;

      // Shallow 25° pitch from the south looking north into the mountains.
      // This angle makes elevated terrain visually obvious.
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(lon, lat - 0.07, 2000),
        orientation: {
          heading: 0,
          pitch: Cesium.Math.toRadians(-25),
          roll: 0
        },
        duration: 1.5
      });
    }

    async function fetchGridAndRender() {
      try {
        const res = await fetch('/reset');
        const data = await res.json();
        computeAndDrawGrid(data.zones);
      } catch(e) {
        console.error('Grid fetch error, using fallback bounds:', e);
        computeAndDrawGrid(null);
      }
    }

    function computeAndDrawGrid(zones) {
      let minLat, maxLat, minLon, maxLon;
      if (zones && Object.keys(zones).length) {
        minLat = 90; maxLat = -90; minLon = 180; maxLon = -180;
        Object.values(zones).forEach(z => {
          const b = z.bounds;
          if (b[0] < minLat) minLat = b[0]; if (b[2] > maxLat) maxLat = b[2];
          if (b[1] < minLon) minLon = b[1]; if (b[3] > maxLon) maxLon = b[3];
        });
      } else {
        minLat = 34.01; maxLat = 34.12; minLon = -118.60; maxLon = -118.46;
      }
      gridBounds = { minLat, maxLat, minLon, maxLon };
      draw3DGrid(minLat, maxLat, minLon, maxLon);
      draw2DGrid(minLat, maxLat, minLon, maxLon);
      resetCameraView();
    }

    function draw3DGrid(minLat, maxLat, minLon, maxLon) {
      if (!viewer) return;
      const nR = 4, nC = 8;
      const dLat = (maxLat - minLat) / nR;
      const dLon = (maxLon - minLon) / nC;
      for (let r = 0; r <= nR; r++) {
        const lat = minLat + r * dLat;
        viewer.entities.add({ polyline: {
          positions: Cesium.Cartesian3.fromDegreesArray([minLon, lat, maxLon, lat]),
          width: (r === 0 || r === nR) ? 5 : 3,
          material: Cesium.Color.CYAN.withAlpha(0.95),
          clampToGround: true,
          classificationType: Cesium.ClassificationType.BOTH
        }});
      }
      for (let c = 0; c <= nC; c++) {
        const lon = minLon + c * dLon;
        viewer.entities.add({ polyline: {
          positions: Cesium.Cartesian3.fromDegreesArray([lon, minLat, lon, maxLat]),
          width: (c === 0 || c === nC) ? 5 : 3,
          material: Cesium.Color.CYAN.withAlpha(0.95),
          clampToGround: true,
          classificationType: Cesium.ClassificationType.BOTH
        }});
      }
    }

    function draw2DGrid(minLat, maxLat, minLon, maxLon) {
      if (!leafletMap) return;
      const nR = 4, nC = 8;
      const dLat = (maxLat - minLat) / nR;
      const dLon = (maxLon - minLon) / nC;
      for (let r = 0; r <= nR; r++) {
        const lat = minLat + r * dLat;
        L.polyline([[lat, minLon],[lat, maxLon]], { color:'#00d2ff', weight:(r===0||r===nR)?4:2 }).addTo(leafletMap);
      }
      for (let c = 0; c <= nC; c++) {
        const lon = minLon + c * dLon;
        L.polyline([[minLat, lon],[maxLat, lon]], { color:'#00d2ff', weight:(c===0||c===nC)?4:2 }).addTo(leafletMap);
      }
    }

    window.onload = initMapEngines;
  </script>
</body>
</html>
