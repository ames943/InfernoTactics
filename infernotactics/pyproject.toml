[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferno-tactics"
version = "0.1.0"
description = "Geospatial wildfire simulation and containment-policy research platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "torch>=2.6,<3",
  "pandas>=2.2,<3",
  "scipy>=1.15,<2",
  "networkx>=3.4,<4",
  "osmnx>=2.0,<3",
  "geopandas>=1.0,<2",
  "rasterio>=1.4,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.7,<4",
  "requests>=2.32,<3",
  "owslib>=0.34,<1",
  "matplotlib>=3.10,<4",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "rich>=13.9,<15",
  "tensorboard>=2.18,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "httpx2>=2.12,<3",
]
legacy-ui = [
  "pydeck>=0.9,<1",
  "streamlit>=1.42,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infernotactics = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
